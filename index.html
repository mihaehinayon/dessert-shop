<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Product list with cart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <main class="main-content">
      <h1 class="page-title">Desserts</h1>
      <div class="products-grid" id="products-grid">
        <!-- Products will be dynamically generated here -->
      </div>
    </main>

    <aside class="cart-sidebar">
      <div class="cart-header">
        <h2>Your Cart (<span id="cart-count">0</span>)</h2>
      </div>
      
      <div class="cart-content">
        <div class="cart-empty" id="cart-empty">
          <img src="./assets/images/illustration-empty-cart.svg" alt="Empty cart" class="empty-cart-icon">
          <p>Your added items will appear here</p>
        </div>
        
        <div class="cart-items" id="cart-items" style="display: none;">
          <!-- Cart items will be populated here -->
        </div>
        
        <div class="cart-total" id="cart-total" style="display: none;">
          <div class="order-total">
            <span>Order Total</span>
            <span class="total-price" id="total-price">$0.00</span>
          </div>
          
          <div class="carbon-neutral">
            <img src="./assets/images/icon-carbon-neutral.svg" alt="Carbon neutral delivery">
            <span>This is a <strong>carbon-neutral</strong> delivery</span>
          </div>
          
          <button class="confirm-order-btn" id="confirm-order-btn">Confirm Order</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- Order Confirmation Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <img src="./assets/images/icon-order-confirmed.svg" alt="Order confirmed">
        <h2>Order Confirmed</h2>
        <p>We hope you enjoy your food!</p>
      </div>
      
      <div class="modal-content">
        <div class="order-summary" id="order-summary">
          <!-- Order items will be populated here -->
        </div>
        
        <div class="modal-total">
          <span>Order Total</span>
          <span class="modal-total-price" id="modal-total-price">$0.00</span>
        </div>
      </div>
      
      <button class="new-order-btn" id="new-order-btn">Start New Order</button>
    </div>
  </div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>

  <script src="script.js"></script>
</body>
</html>
